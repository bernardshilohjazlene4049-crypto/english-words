  color: var(--green);
  border: 1px solid rgba(12, 138, 104, 0.24);
}
body:not(.dark) .hero .small.muted,
body:not(.dark) .hero p {
  color: var(--ink-secondary);
}
body:not(.dark) .hero h2 {
  color: var(--ink);
}
body:not(.dark) .hero h2 strong {
  color: var(--green);
  text-shadow: none;
}
body:not(.dark) .hero-spotlight {
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid rgba(15, 38, 52, 0.10);
  color: var(--ink);
  box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.9);
}
body:not(.dark) .hero-spotlight strong {
  color: var(--green);
}
body:not(.dark) .hero-spotlight .spot-cn {
  color: var(--ink-secondary);
}
body:not(.dark) .hero .primary {
  background: var(--primary-grad);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.45);
  box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, 0.45), 0 10px 24px -6px var(--brand-glow);
}
body:not(.dark) .hero button:not(.primary):not(.resume) {
  background: rgba(255, 255, 255, 0.78);
  color: var(--ink);
  border: 1px solid rgba(15, 38, 52, 0.14);
  box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.95), 0 4px 12px rgba(15, 37, 52, 0.06);
}
body:not(.dark) .hero button:not(.primary):not(.resume):hover {
  background: rgba(255, 255, 255, 0.95);
  border-color: var(--green);
  color: var(--green);
}
body:not(.dark) .hero .resume {
  background: var(--soft);
  color: var(--green);
  border: 1px solid rgba(12, 138, 104, 0.24);
}
body:not(.dark) .hero .ring {
  background: rgba(255, 255, 255, 0.76);
  border: 1px solid rgba(255, 255, 255, 0.95);
  box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.95), 0 12px 26px -6px rgba(15, 37, 52, 0.10);
}
body:not(.dark) .hero .ring svg circle:first-child {
  stroke: rgba(15, 38, 52, 0.10);
}
body:not(.dark) .hero .ring .ring-arc {
  stroke: var(--green);
}
body:not(.dark) .hero .ring .big {
  color: var(--ink);
}
body:not(.dark) .hero .ring .small {
  color: var(--ink-secondary);
}
body.dark .hero {
  background: var(--hero-bg);
  color: #ffffff;
}

/* 5.2: Custom Daily New Words Picker Modal (Apple Liquid Glass) */
.picker-modal {
  width: 100%;
  max-width: 820px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  border-radius: 26px;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(34px) saturate(200%);
  -webkit-backdrop-filter: blur(34px) saturate(200%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-specular), 0 32px 72px -12px rgba(8, 24, 38, 0.36);
  overflow: hidden;
}
.picker-head {
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 11px;
}
.picker-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.picker-controls input[type="search"] {
  flex: 1 1 200px;
  min-height: 40px;
  padding: 8px 14px;
}
.picker-controls select {
  min-height: 40px;
  padding: 8px 12px;
  max-width: 250px;
}
.picker-quick {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
}
.picker-quick button {
  min-height: 34px;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 12.5px;
}
.picker-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px 18px;
}
.picker-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}
.pick-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 13px;
  border-radius: 15px;
  background: var(--glass-bg-subtle);
  border: 1.5px solid var(--glass-border-subtle);
  cursor: pointer;
  text-align: left;
  transition: border-color .18s var(--ease-apple), background .18s, transform .16s;
}
.pick-item:hover {
  border-color: var(--green);
  background: var(--glass-bg-strong);
}
.pick-item.picked {
  background: var(--soft);
  border-color: var(--green);
  box-shadow: inset 0 1px 0.5px rgba(255,255,255,0.65);
}
.pick-check {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 1.5px solid var(--muted);
  display: grid;
  place-items: center;
  flex: none;
  font-size: 13px;
  font-weight: 800;
  color: transparent;
  background: rgba(255,255,255,0.55);
}
.pick-item.picked .pick-check {
  background: var(--green);
  border-color: var(--green);
  color: #ffffff;
}
.pick-main { flex: 1; min-width: 0; }
.pick-main strong { font-size: 15px; display: inline; }
.pick-main .pick-cn { font-size: 12.5px; color: var(--ink-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.picker-foot {
  padding: 13px 20px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  background: var(--glass-bg-subtle);
}
.today-btn-on {
  background: var(--soft) !important;
  color: var(--green) !important;
  border-color: var(--green) !important;
  font-weight: 700;
}
@media(max-width:680px) {
  .picker-grid { grid-template-columns: 1fr; }
  .picker-modal { max-height: 90vh; border-radius: 22px; }
  .picker-controls select { max-width: 100%; width: 100%; }
}


/* 5.3: Custom Study Group Editor Styles */
.grp-add-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  padding: 10px 12px;
  border-radius: 14px;
  background: var(--glass-bg-subtle);
  border: 1px dashed var(--glass-border);
  align-items: center;
}
.grp-add-bar input {
  flex: 1 1 130px;
  min-height: 36px;
  padding: 6px 11px;
  font-size: 13px;
}
.grp-add-bar button {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 12.5px;
}
.grp-tag-mod {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--green);
}

</style>
